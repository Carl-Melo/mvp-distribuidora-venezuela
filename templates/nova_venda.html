<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Distribuidora Venezuela - Nova Venda</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        .conteudo { padding: 16px; max-width: 500px; margin: 0 auto; }
        .campo { margin-bottom: 16px; }
        .campo label { display: block; font-weight: bold; margin-bottom: 6px; color: #0b192c; }
        .campo input, .campo select {
            width: 100%;
            min-height: 48px;
            padding: 10px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 1rem;
            box-sizing: border-box;
            background-color: #ffffff;
        }
        .btn-enviar { width: 100%; border: none; font-size: 1rem; cursor: pointer; }
        .alerta { background-color: #fee2e2; color: #991b1b; padding: 12px; border-radius: 8px; margin-bottom: 16px; font-weight: bold; }
    </style>
</head>
<body>
    <header class="topo">
        <span><strong>Distribuidora Venezuela</strong></span>
        <a href="{{ url_for('index') }}" class="btn-sair" style="color: #ffffff;">Voltar</a>
    </header>

    <main class="conteudo">
        <h2>Registrar Nova Venda</h2>

        {% with messages = get_flashed_messages() %}
          {% if messages %}
            {% for msg in messages %}
              <div class="alerta">{{ msg }}</div>
            {% endfor %}
          {% endif %}
        {% endwith %}

        <form method="POST" action="{{ url_for('nova_venda') }}">
            <div class="campo">
                <label for="valor_venda">Valor da Venda (R$)</label>
                <input type="number" step="0.01" id="valor_venda" name="valor_venda" placeholder="Ex: 100.00" required>
            </div>

            <div class="campo">
                <label for="custo_estimado">Custo Estimado (R$)</label>
                <input type="number" step="0.01" id="custo_estimado" name="custo_estimado" placeholder="Ex: 70.00" required>
            </div>

            <div class="campo">
                <label for="modalidade">Modalidade</label>
                <select id="modalidade" name="modalidade" required>
                    <option value="Atacado">Atacado</option>
                    <option value="Varejo">Varejo</option>
                </select>
            </div>

            <div class="campo">
                <label for="forma_pagamento">Forma de Pagamento</label>
                <select id="forma_pagamento" name="forma_pagamento" required>
                    <option value="Pix">Pix</option>
                    <option value="Dinheiro">Dinheiro</option>
                    <option value="Cartao">Cartão</option>
                    <option value="credito">Crédito Cliente (Fiado)</option>
                </select>
            </div>

            <div class="campo">
                <label for="cliente_id">Cliente (Obrigatório no Crédito)</label>
                <select id="cliente_id" name="cliente_id">
                    <option value="">Selecione...</option>
                    {% for cliente in clientes %}
                        <option value="{{ cliente.id }}">{{ cliente.nome_razao }}</option>
                    {% endfor %}
                </select>
            </div>

            <button type="submit" class="btn-primario btn-verde btn-enviar">Confirmar Venda</button>
            <a href="{{ url_for('index') }}" class="btn-primario btn-azul">Cancelar e Voltar</a>
        </form>
    </main>
</body>
</html>
